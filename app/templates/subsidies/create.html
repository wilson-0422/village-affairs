{% extends "base.html" %}

{% block title %}新增补贴 - 乡村村务数字化系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>💰 新增补贴项目</h3>
    <a href="{{ url_for('subsidies.list_subsidies') }}" class="btn btn-secondary">返回列表</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">补贴名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">补贴类别 <span class="text-danger">*</span></label>
                    <select class="form-select" id="category" name="category" required>
                        <option value="农业补贴">农业补贴</option>
                        <option value="教育补贴">教育补贴</option>
                        <option value="医疗补贴">医疗补贴</option>
                        <option value="养老补贴">养老补贴</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">补贴标准（元/人） <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="amount" name="amount" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="total_budget" class="form-label">预算总额（元） <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="total_budget" name="total_budget" step="0.01" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">补贴说明</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-success">提交</button>
            <a href="{{ url_for('subsidies.list_subsidies') }}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
