{% extends "base.html" %}

{% block title %}补贴发放 - {{ subsidy.name }} - 乡村村务数字化系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>💰 补贴发放登记 - {{ subsidy.name }}</h3>
    <a href="{{ url_for('subsidies.detail', subsidy_id=subsidy.id) }}" class="btn btn-secondary">返回详情</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <p><strong>补贴名称：</strong>{{ subsidy.name }}</p>
        <p><strong>补贴标准：</strong>{{ "%.2f"|format(subsidy.amount) }} 元/人</p>
        <p><strong>预算总额：</strong>{{ "%.2f"|format(subsidy.total_budget) }} 元</p>
    </div>
</div>

<div class="card">
    <div class="card-header bg-light">
        <h5 class="mb-0">发放名单</h5>
    </div>
    <div class="card-body">
        <form method="POST" id="distributeForm">
            <div id="distributionList">
                <div class="row mb-2 distribution-row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="villager_name" placeholder="村民姓名" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="id_card" placeholder="身份证号" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" name="amount" step="0.01" value="{{ subsidy.amount }}" placeholder="发放金额">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger btn-sm remove-row" title="删除">✕</button>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <button type="button" class="btn btn-outline-success" id="addRow">+ 添加村民</button>
            </div>
            <button type="submit" class="btn btn-success">确认发放登记</button>
            <a href="{{ url_for('subsidies.detail', subsidy_id=subsidy.id) }}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
