{% extends "base.html" %}

{% block title %}注册 - 乡村村务数字化系统{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0">用户注册</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
                    </div>
                    <div class="mb-3">
                        <label for="real_name" class="form-label">真实姓名</label>
                        <input type="text" class="form-control" id="real_name" name="real_name" required placeholder="请输入真实姓名">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">联系电话</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="请输入联系电话">
                    </div>
                    <button type="submit" class="btn btn-success w-100">注册</button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted">已有账号？</span>
                    <a href="{{ url_for('auth.login') }}">立即登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
