{% extends "base.html" %}

{% block title %}登录 - 乡村村务数字化系统{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0">用户登录</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn btn-success w-100">登录</button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted">还没有账号？</span>
                    <a href="{{ url_for('auth.register') }}">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
