{% extends "base.html" %}

{% block title %}新增公示 - 乡村村务数字化系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>📢 新增公示</h3>
    <a href="{{ url_for('notices.list_notices') }}" class="btn btn-secondary">返回列表</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label">公示标题 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">公示类别 <span class="text-danger">*</span></label>
                    <select class="form-select" id="category" name="category" required>
                        <option value="财务公示">财务公示</option>
                        <option value="政策通知">政策通知</option>
                        <option value="人事任免">人事任免</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="publisher" class="form-label">发布人</label>
                    <input type="text" class="form-control" id="publisher" name="publisher">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="publish_date" class="form-label">发布日期</label>
                    <input type="date" class="form-control" id="publish_date" name="publish_date">
                </div>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">状态</label>
                <select class="form-select" id="status" name="status">
                    <option value="草稿">草稿</option>
                    <option value="已发布">已发布</option>
                    <option value="已下架">已下架</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">公示内容 <span class="text-danger">*</span></label>
                <textarea class="form-control" id="content" name="content" rows="8" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">提交</button>
            <a href="{{ url_for('notices.list_notices') }}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
